<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthony Yaghi | AI Engineer</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;

      /* Background image */
      background-image: linear-gradient(rgba(2,6,23,0.75), rgba(15,23,42,0.85)), url("bg.jfif");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .container {
      max-width: 420px;
      padding: 30px 25px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .title {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #38bdf8;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 25px;
      color: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      color: #e5e7eb;
      background-color: #1e293b;
      border: 1px solid #334155;
      transition: 0.2s ease;
      font-weight: 600;
      font-size: 14px;
    }

    .btn:hover {
      background-color: #38bdf8;
      color: #020617;
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    @media (max-width: 480px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container" style="background-color:black;">


    <!-- Replace profile.jpg with your actual image file -->
    <img src="profile.jfif" alt="Anthony Yaghi">

    <div class="name">Anthony Yaghi</div>
    <div class="title">AI Engineer</div>

    <div class="buttons">
      <a class="btn" href="https://www.linkedin.com/in/anthonyyaghi/" target="_blank">LinkedIn</a>
      <a class="btn" href="https://github.com/yaghi27" target="_blank">GitHub</a>
      <a class="btn" href="mailto:yaghianthony55@email.com">Email</a>
      <a class="btn" href="cv.pdf" download>Download CV</a>
    </div>

  </div>

</body>
</html>
